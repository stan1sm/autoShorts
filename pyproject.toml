[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-generator"
version = "0.1.0"
description = "Turn long-form video into platform-ready vertical short clips with captions and metadata."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.12",
    "yt-dlp>=2024.4.9",
]

[project.optional-dependencies]
local-whisper = ["faster-whisper>=1.0"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.30"]
gui = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "psutil>=5.9"]
posting = ["httpx>=0.27", "boto3>=1.34", "tzdata"]
all = [
    "faster-whisper>=1.0", "anthropic>=0.40", "openai>=1.30",
    "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "psutil>=5.9",
    "httpx>=0.27", "boto3>=1.34", "tzdata",
]
dev = ["pytest>=8.0", "httpx>=0.27", "tzdata"]

[project.scripts]
shorts = "shorts.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shorts = ["gui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
